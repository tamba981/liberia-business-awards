<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ============ AUTHENTICATION CHECK ============ -->
    <script>
        (function() {
            const token = localStorage.getItem('lba_auth_token');
            const userRole = localStorage.getItem('lba_user_role');
            
            if (!token || userRole !== 'partner') {
                localStorage.removeItem('lba_auth_token');
                localStorage.removeItem('lba_user_data');
                localStorage.removeItem('lba_user_role');
                window.location.replace('../login.html');
                return;
            }
            
            // Use relative API path or environment-aware URL
            const API_BASE = (function() {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    return 'http://localhost:8080/api';
                }
                return 'https://liberia-business-awards-production.up.railway.app/api';
            })();
            
            fetch(`${API_BASE}/partner/verify`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('lba_auth_token');
                        localStorage.removeItem('lba_user_data');
                        localStorage.removeItem('lba_user_role');
                    }
                    throw new Error('Invalid token');
                }
                return response.json();
            }).then(data => {
                if (!data.success || data.partner?.status !== 'active') {
                    throw new Error('Partner account not active');
                }
                console.log('✅ Partner authentication verified');
            }).catch(() => {
                localStorage.clear();
                window.location.replace('../login.html');
            });
        })();
    </script>
    
    <!-- ============ SECURITY LAYER ============ -->
    <script>
        (function() {
            'use strict';
            const noop = function() {};
            if (window.console) {
                const methods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'dir', 'table', 'group', 'groupCollapsed', 'groupEnd', 'clear', 'count', 'assert', 'profile', 'profileEnd', 'time', 'timeEnd'];
                methods.forEach(function(method) {
                    if (window.console[method]) {
                        window.console[method] = noop;
                    }
                });
            }
            
            function blockDevToolsShortcuts(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 's')) {
                    e.preventDefault();
                    return false;
                }
                return true;
            }
            
            function blockContextMenu(e) {
                const target = e.target;
                if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT') {
                    return true;
                }
                e.preventDefault();
                return false;
            }
            
            try {
                document.addEventListener('contextmenu', blockContextMenu);
                window.addEventListener('keydown', blockDevToolsShortcuts);
            } catch (err) {}
            
            const originalCreateElement = document.createElement;
            document.createElement = function(tagName) {
                const element = originalCreateElement.call(document, tagName);
                if (tagName && tagName.toLowerCase() === 'script') {
                    const originalSetAttribute = element.setAttribute;
                    element.setAttribute = function(name, value) {
                        if (name && name.toLowerCase() === 'src') {
                            const srcValue = value;
                            const allowed = [
                                window.location.origin,
                                'https://cdnjs.cloudflare.com',
                                'https://unpkg.com',
                                'https://fonts.googleapis.com',
                                'https://code.jquery.com',
                                'https://cdn.jsdelivr.net'
                            ];
                            let isAllowed = false;
                            for (let i = 0; i < allowed.length; i++) {
                                if (srcValue.indexOf(allowed[i]) === 0) {
                                    isAllowed = true;
                                    break;
                                }
                            }
                            if (!isAllowed) {
                                return;
                            }
                        }
                        originalSetAttribute.call(this, name, value);
                    };
                }
                return element;
            };
        })();
    </script>

        /* Toast */
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: white;
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
            max-width: 450px;
            min-width: 280px;
        }
        
        .toast.success { border-left-color: var(--success-color); }
        .toast.error { border-left-color: var(--danger-color); }
        .toast.warning { border-left-color: var(--warning-color); }
        .toast.info { border-left-color: var(--info-color); }
        
        .toast-close {
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 16px;
            padding: 0 5px;
        }
        
        .toast-close:hover { color: var(--lba-dark); }
        
        /* Pages */
        .page { display: none; }
        .page.active { display: block; }

        .message-item {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 15px;
            align-items: flex-start;
            transition: all 0.3s;
        }
        
        .message-item:hover { background: #f8fafc; }
        .message-item.unread { background: #f0f9ff; border-left: 3px solid var(--lba-primary); }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--lba-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
        }
        .message-content { flex: 1; min-width: 0; }
        .message-title { font-weight: 600; margin-bottom: 5px; }
        .message-text { font-size: 14px; color: #64748b; margin-bottom: 5px; word-wrap: break-word; }
        .message-time { font-size: 11px; color: #94a3b8; }
        
        /* Events */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .event-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        .event-header { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .event-title { font-weight: 600; font-size: 16px; flex: 1; }
        .event-body { padding: 20px; flex: 1; }
        .event-body p { color: #64748b; font-size: 14px; line-height: 1.5; }
        .event-footer { padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .event-date { font-size: 13px; color: #64748b; }
        
        /* Document Cards */
        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }
        
        .document-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s;
        }
        
        .document-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        
        .document-icon {
            font-size: 32px;
            width: 50px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .document-info {
            flex: 1;
            min-width: 0;
        }
        
        .document-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--lba-dark);
            word-break: break-word;
        }
        
        .document-date {
            font-size: 12px;
            color: #64748b;
        }
        
        .document-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        
        .document-actions button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: #f1f5f9;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .document-actions button:hover {
            background: var(--lba-primary);
            color: white;
        }
        
        .document-actions button:last-child:hover {
            background: var(--danger-color);
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .page-btn {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }
        
        .page-btn:hover:not(:disabled) {
            background: var(--lba-primary);
            color: white;
            border-color: var(--lba-primary);
        }
        
        .page-btn.active {
            background: var(--lba-primary);
            color: white;
            border-color: var(--lba-primary);
        }
        
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            background: var(--lba-gradient);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(139,92,246,0.3);
        }
        
        .menu-toggle:hover { transform: scale(1.05); }
        
        /* Thread View Styles */
        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        
        .message-bubble.own {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-bubble.other {
            background: white;
            color: #1a202c;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        
        .thread-messages {
            padding: 20px;
            max-height: calc(90vh - 280px);
            overflow-y: auto;
            background: #f8fafc;
        }
        
        .reply-area {
            padding: 15px 20px;
            border-top: 1px solid #e2e8f0;
            background: white;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .reply-area textarea {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            resize: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        
        .reply-area textarea:focus {
            outline: none;
            border-color: var(--lba-primary);
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; }
            .menu-toggle { display: flex; }
            .header { flex-direction: column; gap: 20px; text-align: center; }
            .user-info { width: 100%; justify-content: center; }
            .form-row { grid-template-columns: 1fr; }
            .events-grid { grid-template-columns: 1fr 1fr; }
        }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
            .action-grid { grid-template-columns: 1fr; }
            .events-grid { grid-template-columns: 1fr; }
            .documents-grid { grid-template-columns: 1fr; }
            .modal-content { max-width: 100%; margin: 10px; max-height: 95vh; }
            .modal-header, .modal-body, .modal-footer { padding: 15px 20px; }
            .modal-body { max-height: 60vh; }
            .header h1 { font-size: 24px; }
            .stat-card { padding: 20px; }
            .stat-content h3 { font-size: 24px; }
        }
        
        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            .header { padding: 15px 20px; }
            .user-info { padding: 10px 15px; flex-wrap: wrap; }
            .user-avatar { width: 40px; height: 40px; font-size: 16px; }
            .modal-header h2 { font-size: 18px; }
            .btn { padding: 10px 18px; font-size: 13px; }
            .modal-footer { flex-wrap: wrap; justify-content: center; }
            .modal-footer .btn { flex: 1; min-width: 100px; }
        }
    </style>

<body>
    <!-- ============ MAIN HTML CONTENT ============ -->
    <!-- The HTML content from your original file goes here -->
    <!-- (I've truncated it for brevity, but include all your modal HTML) -->
    
    <!-- ============ TOAST CONTAINER ============ -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- ============ SCRIPTS ============ -->
    <script>
        // ============================================
        // CONFIGURATION - Environment Aware
        // ============================================
        const API_BASE = (() => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:8080/api';
            }
            return 'https://liberia-business-awards-production.up.railway.app/api';
        })();
        
        // ============================================
        // STATE
        // ============================================
        let appState = {
            user: null,
            profile: {},
            partnerId: null,
            events: [],
            sessions: [],
            messages: [],
            notifications: [],
            currentPage: 'dashboard',
            currentThreadId: null
        };
        
        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: 'check-circle',
                error: 'exclamation-circle',
                warning: 'exclamation-triangle',
                info: 'info-circle'
            };
            toast.innerHTML = `
                <i class="fas fa-${icons[type] || 'info-circle'}"></i>
                <span style="flex: 1;">${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100px)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 5000);
        }
        
        // ============================================
        // MODAL HELPERS
        // ============================================
        function showModal(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        
        function hideModal(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        
        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            localStorage.removeItem('lba_auth_token');
            localStorage.removeItem('lba_user_data');
            localStorage.removeItem('lba_user_role');
            window.location.href = '../login.html';
        }
        
        // ============================================
        // EXPOSE FUNCTIONS TO GLOBAL SCOPE
        // ============================================
        window.escapeHtml = escapeHtml;
        window.showToast = showToast;
        window.showModal = showModal;
        window.hideModal = hideModal;
        window.logout = logout;
        
        // ============================================
        // API HELPER
        // ============================================
        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('lba_auth_token');
            
            if (!token && !endpoint.includes('/login') && !endpoint.includes('/register')) {
                console.warn('🔒 No auth token found for:', endpoint);
                window.location.href = '../login.html';
                throw new Error('No authentication token');
            }
            
            const defaultOptions = {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            };
            
            if (options.body instanceof FormData) {
                delete defaultOptions.headers['Content-Type'];
            }
            
            const fetchOptions = { ...defaultOptions, ...options };
            if (fetchOptions.headers) {
                fetchOptions.headers = { ...defaultOptions.headers, ...options.headers };
            }
            
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, fetchOptions);
                
                if (response.status === 401) {
                    console.error('❌ 401 Unauthorized for:', endpoint);
                    if (!endpoint.includes('/verify')) {
                        localStorage.removeItem('lba_auth_token');
                        localStorage.removeItem('lba_user_data');
                        localStorage.removeItem('lba_user_role');
                        window.location.href = '../login.html';
                    }
                    const error = new Error('Unauthorized');
                    error.status = 401;
                    throw error;
                }
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `HTTP ${response.status}`);
                }
                
                return response.json();
            } catch (error) {
                if (error.status === 401) throw error;
                throw error;
            }
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🤝 Partner Dashboard Initializing...');
            
            try {
                const token = localStorage.getItem('lba_auth_token');
                if (!token) {
                    console.warn('🔒 No token found, redirecting to login');
                    window.location.href = '../login.html';
                    return;
                }
                
                await loadUserProfile();
                setupUI();
                setupNavigation();
                setupSidebarToggle();
                setupLogout();
                await loadEvents();
                await loadSessions();
                await loadMessages();
                await loadNotifications();
                await loadDocuments();
                
                console.log('✅ Partner Dashboard Ready');
            } catch (error) {
                console.error('❌ Dashboard initialization failed:', error);
                if (error.message === 'Unauthorized' || error.status === 401) {
                    localStorage.removeItem('lba_auth_token');
                    localStorage.removeItem('lba_user_data');
                    localStorage.removeItem('lba_user_role');
                    window.location.href = '../login.html';
                }
            }
        });
        
        // ============================================
        // USER PROFILE
        // ============================================
        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('lba_auth_token');
                const userData = JSON.parse(localStorage.getItem('lba_user_data') || '{}');
                
                if (!token) {
                    throw new Error('No token found');
                }
                
                appState.user = userData;
                
                const response = await fetch(`${API_BASE}/partner/profile`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.status === 401) {
                    const error = new Error('Unauthorized');
                    error.status = 401;
                    throw error;
                }
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.profile) {
                    appState.profile = data.profile;
                    appState.partnerId = data.profile._id || data.profile.id;
                    appState.user.name = data.profile.organization_name || appState.user.name;
                    appState.user.email = data.profile.email || appState.user.email;
                    localStorage.setItem('lba_user_data', JSON.stringify(appState.user));
                } else {
                    throw new Error(data.message || 'Failed to load profile');
                }
                
                updateUserDisplay();
                return true;
            } catch (error) {
                console.error('Error loading profile:', error);
                throw error;
            }
        }
        
        function updateUserDisplay() {
            const user = appState.user || {};
            const profile = appState.profile || {};
            
            const name = profile.organization_name || user.name || 'Partner';
            const email = user.email || 'partner@example.com';
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            
            const nameEl = document.getElementById('partnerName');
            const userNameEl = document.getElementById('userName');
            const emailEl = document.getElementById('userEmail');
            const avatarEl = document.getElementById('userAvatar');
            const settingsOrg = document.getElementById('settingsOrgName');
            const settingsEmail = document.getElementById('settingsEmail');
            const sinceEl = document.getElementById('partnerSince');
            const settingsSince = document.getElementById('settingsPartnerSince');
            
            if (nameEl) nameEl.textContent = name;
            if (userNameEl) userNameEl.textContent = name;
            if (emailEl) emailEl.textContent = email;
            if (avatarEl) avatarEl.textContent = initials || 'P';
            if (settingsOrg) settingsOrg.textContent = name;
            if (settingsEmail) settingsEmail.textContent = email;
            
            const since = profile.created_at ? new Date(profile.created_at).getFullYear() : '2025';
            if (sinceEl) sinceEl.textContent = since;
            if (settingsSince) settingsSince.textContent = since;
        }
        
        // ============================================
        // UI SETUP
        // ============================================
        function setupUI() {
            document.addEventListener('click', (e) => {
                const sidebar = document.getElementById('sidebar');
                const toggle = document.getElementById('menuToggle');
                if (window.innerWidth <= 992 && 
                    sidebar && !sidebar.contains(e.target) && 
                    toggle && !toggle.contains(e.target) && 
                    sidebar.classList.contains('active')) {
                    sidebar.classList.remove('active');
                }
            });
        }
        
        function setupSidebarToggle() {
            const toggle = document.getElementById('menuToggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar) sidebar.classList.toggle('active');
                });
            }
        }
        
        function setupNavigation() {
            document.querySelectorAll('.menu-item[data-page]').forEach(item => {
                item.addEventListener('click', () => {
                    switchPage(item.dataset.page);
                });
            });
        }
        
        function setupLogout() {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', logout);
            }
        }
        
        // ============================================
        // PAGE NAVIGATION
        // ============================================
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            const target = document.getElementById(page + 'Page');
            if (target) target.classList.add('active');
            
            document.querySelectorAll('.menu-item[data-page]').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.page === page) item.classList.add('active');
            });
            
            const titles = {
                dashboard: 'Dashboard',
                events: 'Events',
                sessions: 'Live Sessions',
                messages: 'Messages',
                notifications: 'Notifications',
                settings: 'Settings',
                documents: 'Documents'
            };
            const titleEl = document.getElementById('pageTitle');
            if (titleEl) titleEl.textContent = titles[page] || 'Dashboard';
            
            appState.currentPage = page;
            
            if (page === 'events') loadEvents();
            if (page === 'sessions') loadSessions();
            if (page === 'messages') loadMessages();
            if (page === 'notifications') loadNotifications();
            if (page === 'documents') loadDocuments();
            
            if (window.innerWidth <= 992) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.classList.remove('active');
            }
        }
        
        // ============================================
        // EVENTS MANAGEMENT (Simplified)
        // ============================================
        async function loadEvents(page = 1) {
            try {
                const response = await apiRequest(`/partner/events?page=${page}&limit=10`);
                if (response.success) {
                    appState.events = response.events || [];
                    displayEvents(appState.events);
                    const countEl = document.getElementById('eventsCount');
                    if (countEl) countEl.textContent = appState.events.length;
                    updateDashboardStats();
                }
            } catch (error) {
                if (error.status === 401) {
                    console.warn('🔒 Auth required for events - redirecting');
                    return;
                }
                console.error('Load events error:', error);
                const grid = document.getElementById('eventsGrid');
                if (grid) {
                    grid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #EF4444;">
                            <i class="fas fa-exclamation-circle" style="font-size: 48px;"></i>
                            <p>Error loading events</p>
                            <button class="btn btn-primary btn-sm" onclick="loadEvents()" style="margin-top: 10px;">
                                <i class="fas fa-sync"></i> Retry
                            </button>
                        </div>
                    `;
                }
            }
        }
        
        function displayEvents(events) {
            const grid = document.getElementById('eventsGrid');
            if (!grid) return;
            
            if (!events || events.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                        <i class="fas fa-calendar-plus" style="font-size: 48px; color: #cbd5e0; margin-bottom: 15px;"></i>
                        <p>No events created yet</p>
                        <button class="btn btn-primary btn-sm" onclick="showCreateEventModal()" style="margin-top: 10px;">
                            <i class="fas fa-plus"></i> Create Your First Event
                        </button>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = events.map(event => {
                const startDate = event.start_date ? new Date(event.start_date) : null;
                const endDate = event.end_date ? new Date(event.end_date) : null;
                const isUpcoming = startDate && startDate > new Date();
                const isLive = startDate && startDate <= new Date() && endDate && endDate >= new Date();
                const isEnded = endDate && endDate < new Date();
                
                let statusClass = 'status-draft';
                let statusText = event.status || 'Draft';
                if (isLive) { statusClass = 'status-live'; statusText = 'Live'; }
                else if (isUpcoming) { statusClass = 'status-upcoming'; statusText = 'Upcoming'; }
                else if (isEnded) { statusClass = 'status-ended'; statusText = 'Ended'; }
                else if (event.status === 'cancelled') { statusClass = 'status-cancelled'; statusText = 'Cancelled'; }
                
                const dateStr = startDate ? startDate.toLocaleDateString() : 'TBD';
                
                return `
                    <div class="event-card">
                        <div class="event-header">
                            <span class="event-title">${escapeHtml(event.title)}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        ${event.image_url ? `
                            <div style="width: 100%; height: 150px; overflow: hidden;">
                                <img src="${event.image_url}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
                            </div>
                        ` : `
                            <div style="width: 100%; height: 60px; background: linear-gradient(135deg, #8B5CF620, #6D28D920);"></div>
                        `}
                        <div class="event-body">
                            <p>${escapeHtml(event.description?.substring(0, 120) || 'No description')}${event.description?.length > 120 ? '...' : ''}</p>
                            <div style="margin-top: 10px; display: flex; gap: 15px; font-size: 13px; color: #64748b; flex-wrap: wrap;">
                                <span><i class="fas fa-calendar"></i> ${dateStr}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(event.location || 'TBD')}</span>
                                <span><i class="fas fa-users"></i> ${event.attendees || 0}</span>
                            </div>
                        </div>
                        <div class="event-footer">
                            <span class="event-date"><i class="fas fa-clock"></i> ${event.type || 'General'}</span>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                ${event.registration_link ? `<a href="${event.registration_link}" target="_blank" class="btn btn-sm btn-primary"><i class="fas fa-external-link-alt"></i> Register</a>` : ''}
                                <button class="btn btn-sm btn-secondary" onclick="editEvent('${event._id}')"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="deleteEvent('${event._id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>

        // ============================================
        // DASHBOARD STATS
        // ============================================
        function updateDashboardStats() {
            const totalEvents = document.getElementById('totalEvents');
            const totalSessions = document.getElementById('totalSessions');
            const totalAttendees = document.getElementById('totalAttendees');
            const unreadMessages = document.getElementById('unreadMessages');
            
            if (totalEvents) totalEvents.textContent = appState.events.length || 0;
            if (totalSessions) totalSessions.textContent = appState.sessions.length || 0;
            
            const attendees = appState.events.reduce((sum, e) => sum + (e.attendees || 0), 0) +
                              appState.sessions.reduce((sum, s) => sum + (s.attendees || 0), 0);
            if (totalAttendees) totalAttendees.textContent = attendees || 0;
            
            const unread = appState.messages.reduce((sum, m) => sum + (m.unread_count || 0), 0);
            if (unreadMessages) unreadMessages.textContent = unread;
            
            updateRecentActivities();
        }
        
        function updateRecentActivities() {
            const container = document.getElementById('recentActivities');
            if (!container) return;
            
            const activities = [];
            
            appState.events.slice(0, 3).forEach(e => {
                activities.push({
                    title: `Event: ${e.title}`,
                    type: 'event',
                    date: e.created_at || e.updated_at || new Date(),
                    status: e.status || 'draft'
                });
            });
            
            appState.sessions.slice(0, 3).forEach(s => {
                activities.push({
                    title: `Session: ${s.title}`,
                    type: 'session',
                    date: s.created_at || new Date(),
                    status: s.status || 'scheduled'
                });
            });
            
            appState.messages.slice(0, 3).forEach(m => {
                activities.push({
                    title: `Message: ${m.subject}`,
                    type: 'message',
                    date: m.last_message_at || new Date(),
                    status: m.unread_count > 0 ? 'unread' : 'read'
                });
            });
            
            activities.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (activities.length === 0) {
                container.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">No recent activities</td></tr>`;
                return;
            }
            
            container.innerHTML = activities.slice(0, 10).map(a => {
                const statusClass = a.status === 'live' || a.status === 'approved' || a.status === 'published' ? 'status-active' :
                                   a.status === 'unread' ? 'status-pending' :
                                   a.status === 'draft' || a.status === 'scheduled' ? 'status-draft' : 'status-pending';
                const statusDisplay = a.status || 'draft';
                let typeIcon = a.type === 'event' ? '📅' : a.type === 'session' ? '🎥' : '📧';
                
                return `
                    <tr>
                        <td>${typeIcon} ${escapeHtml(a.title)}</td>
                        <td>${a.type.charAt(0).toUpperCase() + a.type.slice(1)}</td>
                        <td>${a.date ? new Date(a.date).toLocaleDateString() : 'Recent'}</td>
                        <td><span class="status-badge ${statusClass}">${statusDisplay}</span></td>
                    </tr>
                `;
            }).join('');
        }

        async function downloadDocument(id) {
            const token = localStorage.getItem('lba_auth_token');
            if (!token) {
                showToast('Please login again', 'error');
                logout();
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/partner/documents/${id}/download?token=${encodeURIComponent(token)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Download failed');
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'document';
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        filename = match[1].replace(/['"]/g, '');
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                showToast('Download started', 'success');
            } catch (error) {
                console.error('Download error:', error);
                showToast('Failed to download document', 'error');
            }
        }
        
        async function deleteDocument(id) {
            if (!confirm('⚠️ Delete this document? This action cannot be undone.')) return;
            
            try {
                const response = await apiRequest(`/partner/documents/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.success) {
                    showToast('Document deleted successfully', 'success');
                    await loadDocuments();
                } else {
                    showToast(response.message || 'Failed to delete document', 'error');
                }
            } catch (error) {
                showToast(error.message || 'Failed to delete document', 'error');
            }
        }
        
        console.log('✅ Partner Dashboard fully functional');
    </script>
</body>
</html>
